<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GeoGebra Airport Scene</title>
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
    <div id="ggb-element"></div>
    <script>
        var parameters = {
            "id": "ggbApplet",
            "width": window.innerWidth,
            "height": window.innerHeight,
            "showAlgebraInput": true,
            "showResetIcon": true,
            "useBrowserForJS": true
        };
        var applet = new GGBApplet(parameters, true);
        window.addEventListener("load", function() {
            applet.inject('ggb-element');
        });

        function runCommands() {
            if (!window.ggbApplet || typeof window.ggbApplet.evalCommand !== 'function') {
                setTimeout(runCommands, 500);
                return;
            }
            const commands = [
              'Sky = Polygon((-1, -0.28), (1, -0.28), (1, 1), (-1, 1))',
              'SetColor(Sky, "lightblue")',
              'Sun = Circle((-0.8, 0.8), 0.08)',
              'SetColor(Sun, "orange")',
              'Terminal12 = Polygon((-0.97, -0.28), (-0.62, -0.28), (-0.62, 0.04), (-0.97, 0.04))',
              'SetColor(Terminal12, "bisque")',
              'TowerBase = Polygon((-0.62, -0.28), (-0.42, -0.28), (-0.42, -0.12), (-0.62, -0.12))',
              'SetColor(TowerBase, "lightgray")',
              'TowerShaft = Polygon((-0.575, -0.12), (-0.445, -0.12), (-0.48, 0.52), (-0.56, 0.52))',
              'SetColor(TowerShaft, "gray")',
              'TowerCabin = Polygon((-0.565, 0.30), (-0.475, 0.30), (-0.475, 0.42), (-0.565, 0.42))',
              'SetColor(TowerCabin, "blue")',
              'TowerDome = Circle((-0.52, 0.575), 0.045)',
              'SetColor(TowerDome, "cyan")',
              'Terminal3 = Polygon((0.02, -0.28), (0.88, -0.28), (0.88, 0.16), (0.02, 0.16))',
              'SetColor(Terminal3, "lightgray")',
              'GlassFacade = Polygon((0.07, -0.08), (0.83, -0.08), (0.83, 0.12), (0.07, 0.12))',
              'SetColor(GlassFacade, "blue")',
              'RoofTrim = Polygon((-0.02, 0.16), (0.91, 0.16), (0.91, 0.21), (-0.02, 0.21))',
              'SetColor(RoofTrim, "darkgray")',
              'RoofTop = Polygon((0.02, 0.21), (0.88, 0.21), (0.88, 0.25), (0.02, 0.25))',
              'SetColor(RoofTop, "white")',
              'Sidewalk = Polygon((-1, -0.36), (1, -0.36), (1, -0.28), (-1, -0.28))',
              'SetColor(Sidewalk, "gray")',
              'Road = Polygon((-1, -1), (1, -1), (1, -0.36), (-1, -0.36))',
              'SetColor(Road, "darkgray")',
              'Divider = Segment((-1, -0.675), (1, -0.675))',
              'SetColor(Divider, "yellow")',
              'SetLineThickness(Divider, 4)',
              'BlueFence = Polygon((-1, -0.48), (1, -0.48), (1, -0.36), (-1, -0.36))',
              'SetColor(BlueFence, "blue")',
              'TreeTrunk1 = Polygon((-0.975, -0.28), (-0.945, -0.28), (-0.945, 0.03), (-0.975, 0.03))',
              'SetColor(TreeTrunk1, "brown")',
              'TreeTop1 = Circle((-0.96, 0.10), 0.08)',
              'SetColor(TreeTop1, "green")',
              'TreeTrunk2 = Polygon((0.905, -0.28), (0.935, -0.28), (0.935, 0.05), (0.905, 0.05))',
              'SetColor(TreeTrunk2, "brown")',
              'TreeTop2 = Circle((0.92, 0.13), 0.09)',
              'SetColor(TreeTop2, "green")',
              'Crane1 = Segment((-0.25, -0.28), (-0.25, 0.47))',
              'SetColor(Crane1, "orange")',
              'SetLineThickness(Crane1, 4)',
              'CraneArm1 = Segment((-0.25, 0.47), (-0.50, 0.43))',
              'SetColor(CraneArm1, "orange")',
              'SetLineThickness(CraneArm1, 3)',
              'Crane2 = Segment((0.55, -0.28), (0.55, 0.47))',
              'SetColor(Crane2, "orange")',
              'SetLineThickness(Crane2, 4)',
              'CraneArm2 = Segment((0.55, 0.47), (0.30, 0.43))',
              'SetColor(CraneArm2, "orange")',
              'SetLineThickness(CraneArm2, 3)',
              'P_0 = (-1.4, 0.70)',
              'P_1 = (-0.5, 0.90)',
              'P_2 = (0.5, 0.65)',
              'P_3 = (1.4, 0.80)',
              'AirplanePath = Curve((1 - t)^3 * P_0 + 3 * (1 - t)^2 * t * P_1 + 3 * (1 - t) * t^2 * P_2 + t^3 * P_3, t, 0, 1)',
              'SetColor(AirplanePath, "red")',
              'SetLineThickness(AirplanePath, 3)'
            ];
            commands.forEach(cmd => window.ggbApplet.evalCommand(cmd));
        }
        setTimeout(runCommands, 1200);
    </script>
</body>
</html>
